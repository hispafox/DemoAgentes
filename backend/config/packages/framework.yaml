# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Domain exceptions -> HTTP status codes (docs/analisis.md §4, "Formato de errores").
    # The domain does not know about HTTP; the API maps its exceptions here.
    exceptions:
        App\Service\Exception\ResourceNotFound: { status_code: 404 }
        App\Entity\Exception\DomainRuleViolation: { status_code: 409 }

    # Errors rendered as JSON take the first MIME type of the "json" format, so
    # listing application/problem+json first makes them RFC 9457 compliant.
    # Successful responses are unaffected: JsonResponse sets application/json.
    request:
        formats:
            json: ['application/problem+json', 'application/json']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
