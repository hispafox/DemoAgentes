# PENDIENTE (#4): para activarlo, moverlo a .github/workflows/ci.yml y subirlo con un
# token que tenga el permiso "workflow" (gh auth refresh -h github.com -s workflow).
#
# CI (issue #4): every pull request and every push to main runs the backend
# checks (PHPUnit, PHPStan level 6 and PHP-CS-Fixer) and the Angular tests.
# If any step fails, the pull request shows up in red.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHPUnit, PHPStan, PHP-CS-Fixer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP-CS-Fixer (code style)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: PHPUnit
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (Angular tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Angular project arrives with issue #3: until then this job only says so.
      - name: Check for the Angular project
        if: hashFiles('frontend/package.json') == ''
        run: echo "frontend/ does not exist yet (issue #3); nothing to test."

      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Angular tests
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
