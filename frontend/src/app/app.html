<header class="header">
  <h1>Lista de tareas</h1>
  <nav aria-label="Principal">
    <a routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
      Tareas
    </a>
    <a routerLink="/tasks/trash" routerLinkActive="active" ariaCurrentWhenActive="page">Papelera</a>
  </nav>
</header>

<main class="content">
  @if (messages.error(); as error) {
    <div class="alert" role="alert">
      <span>{{ error }}</span>
      <button type="button" (click)="messages.clear()" aria-label="Cerrar aviso">×</button>
    </div>
  }

  <p class="sr-only" role="status" aria-live="polite">{{ messages.status() }}</p>

  <router-outlet />
</main>
