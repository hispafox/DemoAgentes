<header class="header">
  <h1>Lista de tareas</h1>
  <nav class="nav" aria-label="Principal">
    <a routerLink="/tasks" routerLinkActive="active" ariaCurrentWhenActive="page">Tareas</a>
  </nav>
</header>

<main class="content">
  @if (messages.error(); as error) {
    <div class="alert" role="alert">
      <span>{{ error }}</span>
      <button type="button" (click)="messages.clear()" aria-label="Cerrar aviso">×</button>
    </div>
  }

  <p class="sr-only" role="status">{{ messages.status() }}</p>

  <router-outlet />
</main>
