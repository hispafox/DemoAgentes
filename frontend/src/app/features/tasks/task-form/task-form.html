<a class="back-link" routerLink="/tasks">← Volver a la lista</a>
<h2 id="form-title">{{ taskId === null ? 'Nueva tarea' : 'Editar tarea' }}</h2>

@if (loading()) {
  <p role="status">Cargando tarea…</p>
} @else if (loadError(); as error) {
  <p>{{ error }}</p>
  <a routerLink="/tasks">Volver a la lista</a>
} @else {
  <form [formGroup]="form" (ngSubmit)="save()" novalidate aria-labelledby="form-title">
    <div class="field" [class.has-error]="titleInvalid">
      <label for="title">Título <span aria-hidden="true">*</span></label>
      <input
        #titleInput
        id="title"
        type="text"
        formControlName="title"
        autocomplete="off"
        aria-required="true"
        [attr.maxlength]="titleMaxLength"
        [attr.aria-invalid]="titleInvalid"
        [attr.aria-describedby]="titleInvalid ? 'title-error' : null"
      />
      @if (titleInvalid) {
        <p class="field-error" id="title-error">Error: {{ titleError }}</p>
      }
    </div>

    <label class="check">
      <input type="checkbox" formControlName="recurring" />
      Tarea repetitiva
    </label>

    @if (form.controls.recurring.value) {
      <div class="field">
        <label for="recurrence">Periodicidad <span aria-hidden="true">*</span></label>
        <select id="recurrence" formControlName="recurrence" aria-required="true">
          <option value="daily">Diaria</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensual</option>
        </select>
      </div>
    }

    <div class="form-actions">
      <button class="btn btn-primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
      <a class="btn btn-secondary" routerLink="/tasks">Cancelar</a>
    </div>
  </form>
}
